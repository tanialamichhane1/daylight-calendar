<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Daylight"><meta name="description" content="A simple private offline calendar and planner"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"><title>Daylight Calendar</title></head>
<body><div class="app"><header><div><div class="eyebrow">MY PLANNER</div><h1>Daylight<span class="sun">✳</span></h1></div><button id="todayBtn" class="outline">Today</button></header>
<nav class="tabs" aria-label="Views"><button data-view="month" class="active">Month</button><button data-view="day">Day</button><button data-view="tasks">To-dos</button></nav>
<main><section id="monthView"><div class="month-nav"><button id="prevMonth" aria-label="Previous month">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" aria-label="Next month">›</button></div><div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendar" class="calendar"></div><h3 id="selectedTitle"></h3><div id="selectedEvents" class="items"></div></section>
<section id="dayView" hidden><div class="day-nav"><button id="prevDay" aria-label="Previous day">‹</button><h2 id="dayTitle"></h2><button id="nextDay" aria-label="Next day">›</button></div><div id="dayEvents" class="items"></div></section>
<section id="tasksView" hidden><div class="section-heading"><h2>To-dos</h2><span id="taskCount"></span></div><form id="taskForm" class="task-entry"><input id="taskText" placeholder="Add a task…" maxlength="180" required aria-label="New task"><button type="submit">Add</button></form><div id="taskList" class="items"></div></section></main>
<button id="addEvent" class="fab" aria-label="Add event">+</button><footer>Stored privately on this device · <button id="exportBtn">Export backup</button> · <button id="importBtn">Import</button><input id="importFile" type="file" accept="application/json,.json" hidden></footer></div>
<dialog id="eventDialog"><form id="eventForm" class="event-form"><div class="dialog-head"><h2 id="dialogTitle">New event</h2><button type="button" id="closeDialog" aria-label="Close">×</button></div><label>Event name<input id="eventName" required maxlength="120" placeholder="Event title"></label><label>Date<input id="eventDate" type="date" required></label><div class="time-fields"><label>Start<input id="eventStart" type="time" required value="09:00"></label><label>End<input id="eventEnd" type="time" required value="10:00"></label></div><label>Category<select id="eventCategory"><option value="personal">Personal</option><option value="work">Work</option><option value="study">Study</option><option value="other">Other</option></select></label><label>Repeat<select id="eventRepeat"><option value="none">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label>Repeat until (optional)<input id="eventUntil" type="date"></label><label>Notes<textarea id="eventNotes" rows="3" maxlength="1000" placeholder="Optional notes"></textarea></label><div class="dialog-actions"><button type="button" id="deleteEvent" class="danger" hidden>Delete</button><button type="submit" class="primary">Save event</button></div></form></dialog>
<script src="./app.js" defer></script></body></html>
